<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Produtos - Vendora</title>
</head>

<body>

    <h1>Cadastro de Produto</h1>

    <form action="{{ url_for('criarproduto') }}" method="POST">

        <label>Nome:</label>
        <input type="text" name="nome" required>

        <br><br>

        <label>Descrição:</label>
        <textarea name="descricao"></textarea>

        <br><br>

        <label>Preço:</label>
        <input type="number" name="preco" step="0.01" min="0" required>

        <br><br>

        <label>Estoque:</label>
        <input type="number" name="estoque" min="0" required>

        <br><br>

        <button type="submit"
                onclick="return confirm('Tem certeza que deseja cadastrar este produto?');">
            Cadastrar Produto
        </button>

    </form>

    <hr>

    <h2>Produtos cadastrados</h2>

    {% for produto in produtos %}

        <p>

            <strong>ID:</strong> {{ produto.id }}
            <br>

            <strong>Nome:</strong> {{ produto.nome }}
            <br>

            <strong>Descrição:</strong> {{ produto.descricao }}
            <br>

            <strong>Preço:</strong> R$ {{ "%.2f"|format(produto.preco) }}
            <br>

            <strong>Estoque:</strong> {{ produto.estoque }}

        </p>

        <hr>

    {% endfor %}

</body>

</html>
