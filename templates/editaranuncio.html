<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Anúncio - Vendora</title>
</head>

<body>

    <h1>Editar Anúncio</h1>

    <form action="{{ url_for('editaranuncio', id=anuncio.id) }}" method="POST">

        <label>Título:</label>
        <input
            type="text"
            name="titulo"
            value="{{ anuncio.titulo }}"
            required
        >

        <br><br>

        <label>Descrição:</label>
        <textarea
            name="descricao"
            required
        >{{ anuncio.descricao }}</textarea>

        <br><br>

        <label>Preço:</label>
        <input
            type="number"
            name="preco"
            step="0.01"
            value="{{ anuncio.preco }}"
            required
        >

        <br><br>

        <label>Quantidade:</label>
        <input
            type="number"
            name="quantidade"
            value="{{ anuncio.quantidade }}"
            required>

        <br><br>

        <label>Categoria:</label>

        <select name="cat_id" required>

            {% for categoria in categorias %}

                <option
                    value="{{ categoria.id }}"
                    {% if anuncio.cat_id == categoria.id %}selected{% endif %}
                >
                    {{ categoria.nome }}
                </option>

            {% endfor %}

        </select>
        <br><br>

        <label>Usuário:</label>

        <select name="usu_id" required>

            {% for usuario in usuarios %}

                <option
                    value="{{ usuario.id }}"
                    {% if anuncio.usu_id == usuario.id %}selected{% endif %}
                >
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button
            type="submit"
            onclick="return confirm('Tem certeza que deseja salvar as alterações?');"
        >
            Salvar alterações
        </button>

    </form>

    <br>

    <a href="{{ url_for('anuncio') }}">
        Voltar para anúncios
    </a>

</body>

</html>
