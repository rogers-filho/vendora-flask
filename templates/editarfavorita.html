<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Favorita - Vendora</title>
</head>

<body>

    <h1>Editar Favorita</h1>

    <form
        action="{{ url_for('editarfavorita', id=favorita.id) }}"
        method="POST"
    >

        <label>Usuário:</label>

        <select name="usu_id" required>

            {% for usuario in usuarios %}

                <option
                    value="{{ usuario.id }}"
                    {% if favorita.usu_id == usuario.id %}
                        selected
                    {% endif %}
                >
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Anúncio:</label>

        <select name="anu_id" required>

            {% for anuncio in anuncios %}

                <option
                    value="{{ anuncio.id }}"
                    {% if favorita.anu_id == anuncio.id %}
                        selected
                    {% endif %}
                >
                    {{ anuncio.titulo }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button
            type="submit"
            onclick="return confirm('Tem certeza que deseja salvar as alterações?');"
        >
            Salvar alterações
        </button>

    </form>

    <br>

    <a href="{{ url_for('favorita') }}">
        Voltar para favoritas
    </a>

</body>

</html>
