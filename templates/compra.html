<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Compras - Vendora</title>
</head>

<body>

    <h1>Cadastro de Compra</h1>

    <form action="{{ url_for('criarcompra') }}" method="POST">

        <label>Usuário:</label>

        <select name="usu_id" required>

            <option value="">
                Selecione um usuário
            </option>

            {% for usuario in usuarios %}

                <option value="{{ usuario.id }}">
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Anúncio:</label>

        <select name="anu_id" required>

            <option value="">
                Selecione um anúncio
            </option>

            {% for anuncio in anuncios %}

                <option value="{{ anuncio.id }}">
                    {{ anuncio.titulo }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Quantidade:</label>

        <input
            type="number"
            name="quantidade"
            min="1"
            required
        >

        <br><br>

        <label>Valor:</label>

        <input
            type="number"
            name="valor"
            step="0.01"
            required
        >

        <br><br>

        <button type="submit">
            Cadastrar compra
        </button>

    </form>

    <hr>

    <h2>Compras cadastradas</h2>

    {% for compra in compras %}

        <p>

            <strong>ID:</strong>
            {{ compra.id }}

            <br>

            <strong>Usuário:</strong>
            {{ compra.usuario.nome }}

            <br>

            <strong>Anúncio:</strong>
            {{ compra.anuncio.titulo }}

            <br>

            <strong>Quantidade:</strong>
            {{ compra.quantidade }}

            <br>

            <strong>Valor:</strong>
            R$ {{ compra.valor }}

            <br><br>

            <a href="{{ url_for('editarcompra', id=compra.id) }}">
                Editar
            </a>

            |

            <a
                href="{{ url_for('deletarcompra', id=compra.id) }}"
                onclick="return confirm('Tem certeza que deseja excluir esta compra?');"
            >
                Excluir
            </a>

        </p>

        <hr>

    {% endfor %}

</body>

</html>
