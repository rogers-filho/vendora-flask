<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Respostas - Vendora</title>
</head>

<body>

    <h1>Cadastro de Resposta</h1>

    <form action="{{ url_for('criarresposta') }}" method="POST">

        <label>Resposta:</label>

        <textarea
            name="texto"
            required
        ></textarea>

        <br><br>

        <label>Usuário:</label>

        <select name="usu_id" required>

            <option value="">
                Selecione um usuário
            </option>

            {% for usuario in usuarios %}

                <option value="{{ usuario.id }}">
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Pergunta:</label>

        <select name="per_id" required>

            <option value="">
                Selecione uma pergunta
            </option>

            {% for pergunta in perguntas %}

                <option value="{{ pergunta.id }}">
                    {{ pergunta.texto }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Cadastrar resposta
        </button>

    </form>

    <hr>

    <h2>Respostas cadastradas</h2>

    {% for resposta in respostas %}

        <p>

            <strong>ID:</strong>
            {{ resposta.id }}

            <br>

            <strong>Resposta:</strong>
            {{ resposta.texto }}

            <br>

            <strong>Usuário:</strong>
            {{ resposta.usuario.nome }}

            <br>

            <strong>Pergunta:</strong>
            {{ resposta.pergunta.texto }}

            <br><br>

            <a href="{{ url_for('editarresposta', id=resposta.id) }}">
                Editar
            </a>

            |

            <a
                href="{{ url_for('deletarresposta', id=resposta.id) }}"
                onclick="return confirm('Tem certeza que deseja excluir esta resposta?');"
            >
                Excluir
            </a>

        </p>

        <hr>

    {% endfor %}

</body>

</html>
