{% extends "base.html" %}

{% block title %}
Editar Categoria - Vendora
{% endblock %}

{% block content %}

<div class="mb-4">

    <h1 class="fw-bold">
        Editar Categoria
    </h1>

    <p class="text-muted">
        Altere as informações da categoria cadastrada.
    </p>

</div>


<div class="card shadow-sm">

    <div class="card-header bg-primary text-white">

        <h4 class="mb-0">
            Dados da categoria
        </h4>

    </div>


    <div class="card-body">

        <form
            action="{{ url_for('editarcategoria', id=categoria.id) }}"
            method="POST"
            onsubmit="return confirm('Tem certeza que deseja salvar as alterações?');"
        >

            <!-- NOME -->

            <div class="mb-3">

                <label for="nome" class="form-label">
                    Nome
                </label>

                <input
                    type="text"
                    class="form-control"
                    id="nome"
                    name="nome"
                    value="{{ categoria.nome }}"
                    required
                >

            </div>


            <!-- DESCRIÇÃO -->

            <div class="mb-3">

                <label for="descricao" class="form-label">
                    Descrição
                </label>

                <textarea
                    class="form-control"
                    id="descricao"
                    name="descricao"
                    rows="5"
                    required
                >{{ categoria.descricao }}</textarea>

            </div>


            <!-- BOTÕES -->

            <div class="d-flex gap-2 mt-3">

                <button
                    type="submit"
                    class="btn btn-success"
                >

                    Salvar alterações

                </button>


                <a
                    href="{{ url_for('categoria') }}"
                    class="btn btn-secondary"
                >

                    Voltar

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
