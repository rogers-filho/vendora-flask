<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Resposta - Vendora</title>
</head>

<body>

    <h1>Editar Resposta</h1>

    <form
        action="{{ url_for('editarresposta', id=resposta.id) }}"
        method="POST"
    >

        <label>Resposta:</label>

        <textarea
            name="texto"
            required
        >{{ resposta.texto }}</textarea>

        <br><br>

        <label>Usuário:</label>

        <select name="usu_id" required>

            {% for usuario in usuarios %}

                <option
                    value="{{ usuario.id }}"
                    {% if resposta.usu_id == usuario.id %}
                        selected
                    {% endif %}
                >
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Pergunta:</label>

        <select name="per_id" required>

            {% for pergunta in perguntas %}

                <option
                    value="{{ pergunta.id }}"
                    {% if resposta.per_id == pergunta.id %}
                        selected
                    {% endif %}
                >
                    {{ pergunta.texto }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button
            type="submit"
            onclick="return confirm('Tem certeza que deseja salvar as alterações?');"
        >
            Salvar alterações
        </button>

    </form>

    <br>

    <a href="{{ url_for('resposta') }}">
        Voltar para respostas
    </a>

</body>

</html>
