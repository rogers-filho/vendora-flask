<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Compra - Vendora</title>
</head>

<body>

    <h1>Editar Compra</h1>

    <form
        action="{{ url_for('editarcompra', id=compra.id) }}"
        method="POST"
    >

        <label>Usuário:</label>

        <select name="usu_id" required>

            {% for usuario in usuarios %}

                <option
                    value="{{ usuario.id }}"
                    {% if compra.usu_id == usuario.id %}
                        selected
                    {% endif %}
                >
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Anúncio:</label>

        <select name="anu_id" required>

            {% for anuncio in anuncios %}

                <option
                    value="{{ anuncio.id }}"
                    {% if compra.anu_id == anuncio.id %}
                        selected
                    {% endif %}
                >
                    {{ anuncio.titulo }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Quantidade:</label>

        <input
            type="number"
            name="quantidade"
            min="1"
            value="{{ compra.quantidade }}"
            required
        >

        <br><br>

        <label>Valor:</label>

        <input
            type="number"
            name="valor"
            step="0.01"
            value="{{ compra.valor }}"
            required
        >

        <br><br>

        <button
            type="submit"
            onclick="return confirm('Tem certeza que deseja salvar as alterações?');"
        >
            Salvar alterações
        </button>

    </form>

    <br>

    <a href="{{ url_for('compra') }}">
        Voltar para compras
    </a>

</body>

</html>
