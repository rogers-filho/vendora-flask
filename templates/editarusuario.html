{% extends "base.html" %}

{% block title %}
Editar Usuário - Vendora
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h1 class="h4 mb-0">
                    Editar Usuário
                </h1>
            </div>

            <div class="card-body">

                <form
                    action="{{ url_for('editarusuario', id=usuario.id) }}"
                    method="POST"
                >

                    <!-- Dados do usuário -->
                    <h2 class="h5 mb-3">
                        Dados do usuário
                    </h2>

                    <div class="mb-3">
                        <label for="nome" class="form-label">
                            Nome
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="nome"
                            name="nome"
                            value="{{ usuario.nome }}"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            value="{{ usuario.email }}"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label">
                            Senha
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="senha"
                            name="senha"
                            value="{{ usuario.senha }}"
                            required
                        >
                    </div>

                    <hr>

                    <!-- Endereço -->
                    <h2 class="h5 mb-3">
                        Endereço
                    </h2>

                    <div class="mb-3">
                        <label for="rua" class="form-label">
                            Rua
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="rua"
                            name="rua"
                            value="{{ endereco.rua if endereco else '' }}"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="numero" class="form-label">
                            Número
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="numero"
                            name="numero"
                            value="{{ endereco.numero if endereco else '' }}"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="bairro" class="form-label">
                            Bairro
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="bairro"
                            name="bairro"
                            value="{{ endereco.bairro if endereco else '' }}"
                        >
                    </div>

                    <div class="mb-3">
                        <label for="cidade" class="form-label">
                            Cidade
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="cidade"
                            name="cidade"
                            value="{{ endereco.cidade if endereco else '' }}"
                        >
                    </div>

                    <div class="mb-4">
                        <label for="cep" class="form-label">
                            CEP
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="cep"
                            name="cep"
                            value="{{ endereco.cep if endereco else '' }}"
                        >
                    </div>

                    <!-- Botões -->
                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            onclick="return confirm('Tem certeza que deseja salvar as alterações?');"
                        >
                            Salvar alterações
                        </button>

                        <a
                            href="{{ url_for('usuario') }}"
                            class="btn btn-secondary"
                            onclick="return confirm('Tem certeza que deseja cancelar as alterações?');"
                        >
                            Cancelar
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
