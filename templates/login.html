{% extends "base.html" %}

{% block title %}
Login - Vendora
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm">

            <div class="card-body p-4">

                <h2 class="text-center mb-2">
                    Entrar
                </h2>

                <p class="text-center text-muted mb-4">
                    Acesse sua conta Vendora
                </p>

                {% if erro %}

                <div class="alert alert-danger" role="alert">
                    {{ erro }}
                </div>

                {% endif %}

                <form method="POST">

                    <div class="mb-3">

                        <label for="email" class="form-label">
                            E-mail
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label for="senha" class="form-label">
                            Senha
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="senha"
                            name="senha"
                            required
                        >

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary">
                            Entrar
                        </button>

                    </div>

                </form>

                <hr>

                <div class="text-center">

                    <p class="mb-2">
                        Ainda não possui cadastro?
                    </p>

                    <a
                        href="{{ url_for('usuario') }}"
                        class="btn btn-outline-secondary">
                        Criar conta
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
