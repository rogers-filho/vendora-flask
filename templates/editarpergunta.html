{% extends "base.html" %}

{% block title %}
Editar Pergunta - Vendora
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">
                <h1 class="h4 mb-0">
                    Editar Pergunta
                </h1>
            </div>

            <div class="card-body">

                <form
                    action="{{ url_for('editarpergunta', id=pergunta.id) }}"
                    method="POST"
                >

                    <div class="mb-3">
                        <label for="texto" class="form-label">
                            Pergunta
                        </label>

                        <textarea
                            class="form-control"
                            id="texto"
                            name="texto"
                            rows="4"
                            required
                        >{{ pergunta.texto }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label for="usu_id" class="form-label">
                            Usuário
                        </label>

                        <select
                            class="form-select"
                            id="usu_id"
                            name="usu_id"
                            required
                        >
                            {% for usuario in usuarios %}

                                <option
                                    value="{{ usuario.id }}"
                                    {% if pergunta.usu_id == usuario.id %}
                                        selected
                                    {% endif %}
                                >
                                    {{ usuario.nome }}
                                </option>

                            {% endfor %}
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="anu_id" class="form-label">
                            Anúncio
                        </label>

                        <select
                            class="form-select"
                            id="anu_id"
                            name="anu_id"
                            required
                        >
                            {% for anuncio in anuncios %}

                                <option
                                    value="{{ anuncio.id }}"
                                    {% if pergunta.anu_id == anuncio.id %}
                                        selected
                                    {% endif %}
                                >
                                    {{ anuncio.titulo }}
                                </option>

                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                            onclick="return confirm('Tem certeza que deseja salvar as alterações?');"
                        >
                            Salvar alterações
                        </button>

                        <a
                            href="{{ url_for('pergunta') }}"
                            class="btn btn-secondary"
                        >
                            Voltar
                        </a>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
