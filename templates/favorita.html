<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Favoritas - Vendora</title>
</head>

<body>

    <h1>Cadastro de Favorita</h1>

    <form action="{{ url_for('criarfavorita') }}" method="POST">

        <label>Usuário:</label>

        <select name="usu_id" required>

            <option value="">
                Selecione um usuário
            </option>

            {% for usuario in usuarios %}

                <option value="{{ usuario.id }}">
                    {{ usuario.nome }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <label>Anúncio:</label>

        <select name="anu_id" required>

            <option value="">
                Selecione um anúncio
            </option>

            {% for anuncio in anuncios %}

                <option value="{{ anuncio.id }}">
                    {{ anuncio.titulo }}
                </option>

            {% endfor %}

        </select>

        <br><br>

        <button type="submit">
            Cadastrar favorita
        </button>

    </form>

    <hr>

    <h2>Favoritas cadastradas</h2>

    {% for favorita in favoritas %}

        <p>

            <strong>ID:</strong>
            {{ favorita.id }}

            <br>

            <strong>Usuário:</strong>
            {{ favorita.usuario.nome }}

            <br>

            <strong>Anúncio:</strong>
            {{ favorita.anuncio.titulo }}

            <br><br>

            <a href="{{ url_for('editarfavorita', id=favorita.id) }}">
                Editar
            </a>

            |

            <a
                href="{{ url_for('deletarfavorita', id=favorita.id) }}"
                onclick="return confirm('Tem certeza que deseja excluir esta favorita?');"
            >
                Excluir
            </a>

        </p>

        <hr>

    {% endfor %}

</body>

</html>
