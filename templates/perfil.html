<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Meu Perfil - Vendora</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                class="navbar-brand"
                href="{{ url_for('index') }}"
            >
                Vendora
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Alternar navegação"
            >

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('index') }}"
                        >
                            Início
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            aria-current="page"
                            href="{{ url_for('perfil') }}"
                        >
                            Meu Perfil
                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="{{ url_for('logout') }}"
                        >
                            Sair
                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- Conteúdo -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-header bg-primary text-white">

                        <h1 class="h4 mb-0">
                            Meu Perfil
                        </h1>

                    </div>


                    <div class="card-body">

                        <form
                            action="{{ url_for('perfil') }}"
                            method="POST"
                        >

                            <!-- Dados pessoais -->
                            <h2 class="h5 mb-3">
                                Dados pessoais
                            </h2>

                            <div class="mb-3">

                                <label
                                    for="nome"
                                    class="form-label"
                                >
                                    Nome
                                </label>

                                <input
                                    type="text"
                                    class="form-control"
                                    id="nome"
                                    name="nome"
                                    value="{{ usuario.nome }}"
                                    required
                                >

                            </div>


                            <div class="mb-3">

                                <label
                                    for="email"
                                    class="form-label"
                                >
                                    E-mail
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    value="{{ usuario.email }}"
                                    required
                                >

                            </div>


                            <div class="mb-4">

                                <label
                                    for="senha"
                                    class="form-label"
                                >
                                    Nova senha
                                </label>

                                <input
                                    type="password"
                                    class="form-control"
                                    id="senha"
                                    name="senha"
                                    placeholder="Digite uma nova senha"
                                >

                                <div class="form-text">

                                    Deixe em branco para manter a senha atual.

                                </div>

                            </div>


                            <hr>


                            <!-- Endereço -->
                            <h2 class="h5 mb-3">
                                Endereço
                            </h2>


                            <div class="row">

                                <div class="col-md-8 mb-3">

                                    <label
                                        for="rua"
                                        class="form-label"
                                    >
                                        Rua
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="rua"
                                        name="rua"
                                        value="{{ endereco.rua if endereco else '' }}"
                                    >

                                </div>


                                <div class="col-md-4 mb-3">

                                    <label
                                        for="numero"
                                        class="form-label"
                                    >
                                        Número
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="numero"
                                        name="numero"
                                        value="{{ endereco.numero if endereco else '' }}"
                                    >

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label
                                        for="bairro"
                                        class="form-label"
                                    >
                                        Bairro
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="bairro"
                                        name="bairro"
                                        value="{{ endereco.bairro if endereco else '' }}"
                                    >

                                </div>


                                <div class="col-md-6 mb-3">

                                    <label
                                        for="cidade"
                                        class="form-label"
                                    >
                                        Cidade
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="cidade"
                                        name="cidade"
                                        value="{{ endereco.cidade if endereco else '' }}"
                                    >

                                </div>


                                <div class="col-md-4 mb-4">

                                    <label
                                        for="cep"
                                        class="form-label"
                                    >
                                        CEP
                                    </label>

                                    <input
                                        type="text"
                                        class="form-control"
                                        id="cep"
                                        name="cep"
                                        value="{{ endereco.cep if endereco else '' }}"
                                    >

                                </div>

                            </div>


                            <!-- Botões -->
                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                    onclick="return confirm('Tem certeza que deseja salvar as alterações?');"
                                >
                                    Salvar alterações
                                </button>

                                <a
                                    href="{{ url_for('index') }}"
                                    class="btn btn-secondary"
                                >
                                    Cancelar
                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
